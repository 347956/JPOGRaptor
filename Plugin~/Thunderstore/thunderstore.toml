[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
description = "JPOGRaptor for Lethal Company."
websiteUrl = "https://github.com/347956/JPOGRaptor"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
TeamXiaolan-DawnLib = "0.9.3"

[build]
icon = "../../Package/icon.png"
readme = "../../Package/README.md"
outdir = "./Packages"

[[build.copy]]
source = "../bin/Release/netstandard2.1/JPOGRaptor.dll"
target = "plugins/JPOGRaptor/"

# The Dusk export from the Unity project: the .duskmod next to the DLL, the content bundle in an Assets/ subfolder (Dusk only loads it from there).
[[build.copy]]
source = "../../AssetBundles/jpograptormainassets.duskmod"
target = "plugins/JPOGRaptor/"

[[build.copy]]
source = "../../AssetBundles/jpograptorassets"
target = "plugins/JPOGRaptor/Assets/"

[[build.copy]]
source = "../../Package/CHANGELOG.md"
target = "/"

[publish]
communities = [ "lethal-company", ]
[publish.categories]
# Get the list of categories from https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "bepinex", "clientside", "serverside", "monsters", "mods", ]